<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>:\ARCHITECT\ Options</title>
  <link rel="stylesheet" href="shell.css" />
  <style>.app-main { max-width: 560px; }</style>
  <link rel="stylesheet" href="i18n/i18n.css" />
  <script type="module" src="i18n/start.js"></script>
</head>
<body>
  <header class="app-bar">
    <span class="app-wordmark">:\ARCHITECT\<sup class="tm">™</sup></span>
    <nav class="app-actions"><a href="https://rchtch.app/" target="_blank" rel="noopener">Open Architect</a></nav>
  </header>
  <main class="app-main">
    <section class="section">
      <h2 class="label">Sign in</h2>
      <p id="who">Sign in with your Cumulus ID. No Cumulus ID yet? Create one here; you come straight back signed in.</p>
      <div class="row" id="signed-out">
        <button class="btn primary" type="button" id="signin">Sign in with Cumulus ID</button>
        <button class="btn" type="button" id="create">Create a Cumulus ID</button>
      </div>
      <div class="row" id="signed-in" hidden>
        <button class="btn" type="button" id="check">Check connection</button>
        <button class="btn" type="button" id="signout">Sign out</button>
      </div>
      <p class="small muted" id="result" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
