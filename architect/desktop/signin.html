<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>:\ARCHITECT\ - Sign in</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#fff; color:#111820; font:400 16px/1.5 Arial, Helvetica, sans-serif; letter-spacing:-.01em; padding:16px; box-sizing:border-box; }
  main { width:min(440px, 100%); display:grid; gap:14px; }
  h1 { font-weight:400; letter-spacing:-.03em; margin:0; font-size:28px; }
  p { margin:0; color:#52606b; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 16px; border:1px solid #111820; color:#111820; text-decoration:none; }
  a.btn.primary { background:#111820; color:#fff; }
  a.btn:focus-visible { outline:2px solid #2454dd; outline-offset:2px; }
  #note { color:#111820; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>:\ARCHITECT\<sup>™</sup></h1>
  <p>Sign in with your Cumulus ID. Your browser opens; when you're done, :\ARCHITECT\ continues here.</p>
  <div class="row">
    <a class="btn primary" href="architect://signin">Sign in with Cumulus ID</a>
    <a class="btn" href="architect://create">Create a Cumulus ID</a>
  </div>
  <p id="note" role="status"></p>
</main>
<script>
  const note = new URLSearchParams(location.search).get("note");
  if (note) document.getElementById("note").textContent = note;
</script>
</body>
</html>
