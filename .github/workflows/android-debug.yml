name: Android debug

on:
  push:
  pull_request:

permissions:
  contents: read

# Repository variable CI_RUNNER may be a self-hosted runner label such as
# infinitum-ci. An empty variable selects the GitHub-hosted runner.
jobs:
  debug-apks:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android 35 platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APKs
        run: ./gradlew test assembleDebug --stacktrace --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: throne-debug-apks
          if-no-files-found: error
          path: |
            apps/throne-launcher/build/outputs/apk/**/*.apk
            apps/throne-guard/build/outputs/apk/**/*.apk
            apps/throne-vault-notes/build/outputs/apk/**/*.apk
