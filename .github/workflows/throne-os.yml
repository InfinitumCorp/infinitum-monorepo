# CI for throne-os/ in the monorepo. Runs only when files under throne-os/ (or this workflow) change.
# Ported from throne-os's own CI; its deploy workflows are not run from the monorepo.
name: throne-os

on:
  pull_request:
    paths:
      - "throne-os/**"
      - ".github/workflows/throne-os.yml"
  push:
    branches: [main]
    paths:
      - "throne-os/**"
      - ".github/workflows/throne-os.yml"
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: throne-os

jobs:
  debug-apks:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # v3 installs the removed SDK package "tools" and fails. v4 does not.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APKs
        run: ./gradlew test assembleDebug --stacktrace --no-daemon
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: throne-debug-apks
          if-no-files-found: error
          retention-days: 7
          path: throne-os/apps/*/build/outputs/apk/*/debug/*.apk
